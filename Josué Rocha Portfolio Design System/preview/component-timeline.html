<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);">
<div class="row" style="gap:14px;flex-wrap:wrap;">
  <!-- Default state -->
  <div style="background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid var(--card-border);border-radius:16px;box-shadow:var(--card-shadow);padding:20px;width:260px;">
    <div style="font-family:var(--font-sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,122,0,.70);margin-bottom:8px;">2023 — 2024</div>
    <div style="font-family:var(--font-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em;color:var(--fg-1);margin-bottom:8px;font-variation-settings:var(--fv-editorial);">Développeur Full-Stack</div>
    <div style="font-family:var(--font-sans);font-size:13px;color:var(--fg-2);line-height:1.5;">Conception et livraison de features produit en React/TypeScript, avec CI/CD et tests automatisés.</div>
  </div>
  <!-- Hover state -->
  <div style="background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid var(--card-border);border-radius:16px;box-shadow:var(--card-shadow-hover);padding:20px;width:260px;transform:scale(1.01);">
    <div style="font-family:var(--font-sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,122,0,.70);margin-bottom:8px;">2021 — 2023</div>
    <div style="font-family:var(--font-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em;color:var(--fg-1);margin-bottom:8px;font-variation-settings:var(--fv-editorial);">Développeur Mainframe</div>
    <div style="font-family:var(--font-sans);font-size:13px;color:var(--fg-2);line-height:1.5;">Maintenance et modernisation d'applications COBOL/JCL sur z/OS pour un grand compte bancaire.</div>
    <div class="muted" style="margin-top:6px;font-size:11px;">· hover state</div>
  </div>
</div>
<script src="_theme.js"></script>
</body></html>
