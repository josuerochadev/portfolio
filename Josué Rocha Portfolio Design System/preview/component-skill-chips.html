<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);">

    <span style="background:var(--violet);color:var(--beige);padding:6px 12px;border-radius:9999px;font-family:var(--font-sans);font-size:13px;font-weight:500;">DB2/SQL</span>
    <span class="muted" style="margin-left:8px;">mainframe — violet/beige</span>
  </div>
  <div class="row" style="gap:6px;flex-wrap:wrap;">

    <span style="background:var(--lime);color:var(--violet-dark);padding:6px 12px;border-radius:9999px;font-family:var(--font-sans);font-size:13px;font-weight:500;">Tailwind</span>

  <div class="row" style="gap:6px;flex-wrap:wrap;">
    <span style="background:var(--orange);color:var(--violet-dark);padding:6px 12px;border-radius:9999px;font-family:var(--font-sans);font-size:13px;font-weight:500;">Node.js</span>
    <span style="background:var(--orange);color:var(--violet-dark);padding:6px 12px;border-radius:9999px;font-family:var(--font-sans);font-size:13px;font-weight:500;">Express</span>
