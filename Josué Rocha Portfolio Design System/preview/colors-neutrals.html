<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--dark-bg);">
<div class="row" style="gap:0;border-radius:12px;overflow:hidden;">
  <div style="flex:1;background:var(--beige);height:96px;padding:10px;color:var(--violet);display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label-xs" style="color:var(--violet);opacity:.8;">Beige</div>
    <div class="mono">#F5F0E8</div>
  </div>
  <div style="flex:1;background:#FFFFFF;height:96px;padding:10px;color:var(--violet);display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid rgba(0,0,0,.05);">
    <div class="label-xs" style="color:var(--violet);opacity:.8;">White</div>
    <div class="mono">#FFFFFF</div>
  </div>
  <div style="flex:1;background:var(--dark-surface);height:96px;padding:10px;color:var(--beige);display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label-xs" style="color:var(--beige);opacity:.8;">Dark Surface</div>
    <div class="mono">#1A1230</div>
  </div>
  <div style="flex:1;background:var(--dark-bg);height:96px;padding:10px;color:var(--beige);display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label-xs" style="color:var(--beige);opacity:.8;">Dark BG</div>
    <div class="mono">#0F0A1A</div>
  </div>
</div>
<script src="_theme.js"></script>
</body></html>
