<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);padding:20px;">
<div class="col" style="gap:18px;">
  <div>
    <div class="label-xs">--card-shadow (default cards)</div>
    <div style="margin-top:8px;width:200px;height:60px;background:var(--bg-2);border-radius:12px;box-shadow:var(--card-shadow);"></div>
  </div>
  <div>
    <div class="label-xs">--card-shadow-hover (hover)</div>
    <div style="margin-top:8px;width:200px;height:60px;background:var(--bg-2);border-radius:12px;box-shadow:var(--card-shadow-hover);"></div>
  </div>
  <div>
    <div class="label-xs">--shadow-cta (CTA buttons)</div>
    <div style="margin-top:8px;width:200px;height:60px;background:var(--bg-2);border-radius:12px;box-shadow:var(--shadow-cta);"></div>
  </div>
  <div>
    <div class="label-xs">--shadow-lime-glow (focus / navbar)</div>
    <div style="margin-top:8px;width:200px;height:60px;background:var(--bg-2);border-radius:12px;box-shadow:var(--shadow-lime-glow);"></div>
  </div>
</div>
<script src="_theme.js"></script>
</body></html>
