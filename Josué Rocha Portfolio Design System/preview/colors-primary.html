<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);">
<div class="row" style="gap:0;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,.05);">
  <div style="flex:1;background:var(--violet);height:96px;padding:10px;color:var(--beige);display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label-xs" style="color:var(--beige);opacity:.8;">Violet</div>
    <div class="mono">#6900FF</div>
  </div>
  <div style="flex:1;background:var(--violet-dark);height:96px;padding:10px;color:var(--beige);display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label-xs" style="color:var(--beige);opacity:.8;">Violet Dark</div>
    <div class="mono">#5500CC</div>
  </div>
  <div style="flex:1;background:var(--lime);height:96px;padding:10px;color:var(--violet-dark);display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label-xs" style="color:var(--violet-dark);opacity:.8;">Lime</div>
    <div class="mono">#B5FF00</div>
  </div>
  <div style="flex:1;background:var(--orange);height:96px;padding:10px;color:var(--beige);display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label-xs" style="color:var(--beige);opacity:.8;">Orange</div>
    <div class="mono">#FF7A00</div>
  </div>
  <div style="flex:1;background:var(--orange-dark);height:96px;padding:10px;color:var(--beige);display:flex;flex-direction:column;justify-content:space-between;">
    <div class="label-xs" style="color:var(--beige);opacity:.8;">Orange Dark</div>
    <div class="mono">#C56200</div>
  </div>
</div>
<script src="_theme.js"></script>
</body></html>
