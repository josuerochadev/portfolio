<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);">
<div class="col" style="gap:14px;">
  <div>
    <div class="label-xs">Card gradient</div>
    <div style="height:64px;border-radius:12px;background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));border:1px solid rgba(181,255,0,.30);"></div>
  </div>
  <div>
    <div class="label-xs">Page gradient — light (animated 25s)</div>
    <div style="height:64px;border-radius:12px;background-image:radial-gradient(at 20% 30%,#ffefc1 0%,transparent 60%),radial-gradient(at 80% 80%,#e2a788 0%,transparent 60%),linear-gradient(135deg,#c4817f,#fef3c7,#b28d6e);background-blend-mode:overlay,soft-light,normal;"></div>
  </div>
  <div>
    <div class="label-xs">Page gradient — dark (animated 25s)</div>
    <div style="height:64px;border-radius:12px;background-image:radial-gradient(at 20% 30%,rgba(105,0,255,.15) 0%,transparent 60%),radial-gradient(at 80% 80%,rgba(181,255,0,.08) 0%,transparent 60%),linear-gradient(135deg,var(--dark-bg),var(--dark-surface),var(--dark-bg));background-blend-mode:overlay,soft-light,normal;"></div>
  </div>
</div>
<script src="_theme.js"></script>
</body></html>
