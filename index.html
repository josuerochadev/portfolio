<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Josué Rocha — Full Stack Web Developer</title>

  <meta name="description"
    content="Portfolio of Josué Xavier Rocha, full stack web developer, passionate about clean code and AGILE." />
  <meta name="author" content="Josué Xavier Rocha" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#6900FF" />

  <!-- Open Graph for social media -->
  <meta property="og:title" content="Josué Rocha — Full Stack Web Developer" />
  <meta property="og:description" content="Discover my work, projects, and background." />
  <meta property="og:image" content="/assets/images/preview.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://josuerocha.dev/" />

  <!-- Resource hints for performance -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Preload fonts with variable weight for LetterRipple effect -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@100..900&family=Rubik:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@100..900&family=Rubik:wght@400;700&display=swap"></noscript>
  
  <!-- Preload critical assets -->
  <link rel="modulepreload" href="/src/main.tsx" />
  <link rel="preload" href="/src/components/sections/hero.tsx" as="script" />
  <link rel="preload" href="/assets/images/projects/project1-desktop.webp" as="image" fetchpriority="high" />

  <!-- Critical CSS for font fallbacks and FOUT prevention -->
  <style>
    /* Font loading with fallbacks that match exact metrics */
    @font-face {
      font-family: 'Fraunces-fallback';
      src: local('Georgia');
      ascent-override: 85%;
      descent-override: 20%;
      line-gap-override: 10%;
      size-adjust: 107%;
      font-display: block;
    }
    
    @font-face {
      font-family: 'Rubik-fallback';
      src: local('Helvetica Neue'), local('Arial');
      ascent-override: 92%;
      descent-override: 22%;
      line-gap-override: 0%;
      size-adjust: 95%;
      font-display: block;
    }

    /* Base font styles optimized for FOUT prevention */
    body { 
      font-family: 'Rubik', 'Rubik-fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .font-display { 
      font-family: 'Fraunces', 'Fraunces-fallback', Georgia, 'Times New Roman', serif;
      font-weight: 900;
      font-synthesis: none;
      letter-spacing: -0.02em; /* Consistent spacing */
    }
    
    .font-body { 
      font-family: 'Rubik', 'Rubik-fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-synthesis: none;
    }

    /* Prevent layout shifts during font loading */
    h1, .font-display {
      font-optical-sizing: auto;
      font-variation-settings: "SOFT" 0, "WONK" 0;
      text-rendering: geometricPrecision;
    }
  </style>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

</head>

<body class="text-violet min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
