<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);">
<div class="col">
  <div class="label-xs">Lime tint scale (alpha on #B5FF00)</div>
  <div class="row" style="gap:0;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.05);">
    <div style="flex:1;background:rgba(181,255,0,0.05);height:48px;padding:6px;"><div class="mono">/5</div></div>
    <div style="flex:1;background:rgba(181,255,0,0.10);height:48px;padding:6px;"><div class="mono">/10</div></div>
    <div style="flex:1;background:rgba(181,255,0,0.20);height:48px;padding:6px;"><div class="mono">/20</div></div>
    <div style="flex:1;background:rgba(181,255,0,0.30);height:48px;padding:6px;"><div class="mono">/30</div></div>
    <div style="flex:1;background:rgba(181,255,0,0.60);height:48px;padding:6px;"><div class="mono">/60</div></div>
    <div style="flex:1;background:var(--lime);height:48px;padding:6px;"><div class="mono">100</div></div>
  </div>
  <div class="label-xs" style="margin-top:4px;">Violet tint scale</div>
  <div class="row" style="gap:0;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.05);">
    <div style="flex:1;background:rgba(105,0,255,0.05);height:48px;padding:6px;"><div class="mono">/5</div></div>
    <div style="flex:1;background:rgba(105,0,255,0.10);height:48px;padding:6px;"><div class="mono">/10</div></div>
    <div style="flex:1;background:rgba(105,0,255,0.20);height:48px;padding:6px;color:var(--beige);"><div class="mono">/20</div></div>
    <div style="flex:1;background:rgba(105,0,255,0.30);height:48px;padding:6px;color:var(--beige);"><div class="mono">/30</div></div>
    <div style="flex:1;background:rgba(105,0,255,0.60);height:48px;padding:6px;color:var(--beige);"><div class="mono">/60</div></div>
    <div style="flex:1;background:var(--violet);height:48px;padding:6px;color:var(--beige);"><div class="mono">100</div></div>
  </div>
</div>
<script src="_theme.js"></script>
</body></html>
