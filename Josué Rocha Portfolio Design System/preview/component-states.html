<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);">
<div class="col" style="gap:12px;">
  <div class="label-xs">Interactive button states</div>
  <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-start;">
    <!-- Focus -->
    <div class="col" style="align-items:center;gap:6px;">
      <button style="background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid rgba(181,255,0,.30);border-radius:9999px;font-family:var(--font-sans);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:.65rem 1.5rem;color:var(--violet);cursor:pointer;outline:2px solid var(--focus-ring,var(--lime));outline-offset:2px;">Focus</button>
      <span class="mono" style="font-size:10px;">focus</span>
    </div>
    <!-- Default -->
    <div class="col" style="align-items:center;gap:6px;">
      <button style="background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid rgba(181,255,0,.30);border-radius:9999px;font-family:var(--font-sans);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:.65rem 1.5rem;color:var(--violet);cursor:pointer;">Default</button>
      <span class="mono" style="font-size:10px;">default</span>
    </div>
    <!-- Hover -->
    <div class="col" style="align-items:center;gap:6px;">
      <button style="background:var(--lime);border:1px solid rgba(181,255,0,.30);border-radius:9999px;font-family:var(--font-sans);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:.65rem 1.5rem;color:var(--orange);cursor:pointer;">Hover</button>
      <span class="mono" style="font-size:10px;">hover</span>
    </div>
    <!-- Active -->
    <div class="col" style="align-items:center;gap:6px;">
      <button style="background:var(--lime);border:1px solid rgba(181,255,0,.30);border-radius:9999px;font-family:var(--font-sans);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:.65rem 1.5rem;color:var(--orange);cursor:pointer;transform:scale(0.95);">Active</button>
      <span class="mono" style="font-size:10px;">active</span>
    </div>
    <!-- Disabled -->
    <div class="col" style="align-items:center;gap:6px;">
      <button style="background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid rgba(181,255,0,.30);border-radius:9999px;font-family:var(--font-sans);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:.65rem 1.5rem;color:var(--violet);opacity:0.5;pointer-events:none;" disabled>Disabled</button>
      <span class="mono" style="font-size:10px;">disabled</span>
    </div>
  </div>
  <div class="muted">Glass capsule — 5 states: focus (lime outline), default, hover (lime bg/orange text), active (scale .95), disabled (opacity .5).</div>
</div>
<script src="_theme.js"></script>
</body></html>
