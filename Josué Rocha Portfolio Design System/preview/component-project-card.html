<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);">
<div style="background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid var(--card-border);border-radius:16px;box-shadow:var(--card-shadow);padding:20px;width:300px;">
  <!-- Image placeholder -->
  <div style="background:linear-gradient(135deg,var(--violet),var(--violet-dark));aspect-ratio:4/3;border-radius:12px;margin-bottom:16px;"></div>
  <!-- Ghost num + title -->
  <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px;">
    <span class="ghost-num" style="font-size:72px;">01.</span>
    <div style="font-family:var(--font-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em;color:var(--fg-1);font-variation-settings:var(--fv-editorial);">Avocate.app</div>
  </div>
  <!-- Description -->
  <p style="font-family:var(--font-sans);font-size:13px;color:var(--fg-2);line-height:1.5;margin:0 0 12px;">Plateforme SaaS pour avocats indépendants — gestion de dossiers, facturation et agenda intégrés.</p>
  <!-- Deliverables -->
  <div class="label-xs" style="margin-bottom:8px;">Deliverables</div>
  <!-- CTA pill -->
  <button style="background:rgba(255,122,0,.10);color:var(--accent-text);border:1px solid rgba(255,122,0,.20);padding:.5rem 1rem;border-radius:9999px;font-family:var(--font-sans);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
    Voir le projet
  </button>
</div>
<script src="_theme.js"></script>
</body></html>
