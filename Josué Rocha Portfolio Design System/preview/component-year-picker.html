<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);">
<div class="col" style="gap:12px;align-items:flex-start;">
  <div style="display:inline-flex;align-items:center;border-radius:9999px;background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid var(--card-border);padding:6px 16px;gap:4px;">
    <button style="background:none;border:none;font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--fg-1);padding:4px 10px;border-radius:9999px;cursor:pointer;">2020</button>
    <span style="font-size:8px;color:var(--fg-3);">•</span>
    <button style="background:none;border:none;font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--fg-1);padding:4px 10px;border-radius:9999px;cursor:pointer;">2021</button>
    <span style="font-size:8px;color:var(--fg-3);">•</span>
    <button style="background:none;border:none;font-family:var(--font-sans);font-size:13px;font-weight:700;color:var(--orange-dark);padding:4px 10px;border-radius:9999px;cursor:pointer;">2023</button>
    <span style="font-size:8px;color:var(--fg-3);">•</span>
    <button style="background:none;border:none;font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--fg-1);padding:4px 10px;border-radius:9999px;cursor:pointer;">2024</button>
    <span style="font-size:8px;color:var(--fg-3);">•</span>
    <button style="background:none;border:none;font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--fg-1);padding:4px 10px;border-radius:9999px;cursor:pointer;">2025</button>
  </div>
  <div class="muted">Year picker — glass pill, bullet separators (8px, fg-3), active year in orange-dark.</div>
</div>
<script src="_theme.js"></script>
</body></html>
