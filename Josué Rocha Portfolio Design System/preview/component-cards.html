<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);">
<div class="row" style="gap:14px;flex-wrap:wrap;">
  <div style="background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid rgba(181,255,0,.30);border-radius:16px;box-shadow:var(--card-shadow);padding:20px;width:280px;">
    <div style="font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--violet);margin-bottom:6px;">Card · default</div>
    <div style="font-family:var(--font-sans);font-size:13px;color:var(--fg-2);">Lime/30 border, lime/orange/violet glass gradient, blur 12, radius 16, shadow-md.</div>
  </div>
  <div style="background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid rgba(181,255,0,.30);border-radius:16px;box-shadow:var(--card-shadow-hover);padding:20px;width:280px;transform:scale(1.01);">
    <div style="font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--violet);margin-bottom:6px;">Card · hover</div>
    <div style="font-family:var(--font-sans);font-size:13px;color:var(--fg-2);">scale(1.01) + shadow-lg, 300ms cubic.</div>
  </div>
</div>
<script src="_theme.js"></script>
</body></html>
