<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .easing-track {
    position: relative;
    height: 40px;
    background: rgba(105,0,255,.04);
    border-radius: 20px;
    overflow: hidden;
  }
  .easing-ball {
    position: absolute;
    left: 8px;
    top: 50%;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .easing-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .easing-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .easing-name {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    color: var(--fg-1);
    min-width: 52px;
  }
  .easing-value {
    font-family: var(--font-sans);
    font-size: 10px;
    color: var(--fg-3);
  }
  .play-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 18px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: linear-gradient(135deg, rgba(105,0,255,.10) 0%, rgba(181,255,0,.10) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--fg-1);
    cursor: pointer;
    box-shadow: var(--card-shadow);
    transition: opacity 150ms;
    outline: none;
  }
  .play-btn:hover { opacity: .85; }
  .play-btn:focus-visible { box-shadow: 0 0 0 3px var(--focus-ring); }
  .play-btn:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body style="background:var(--beige);padding:20px;">
<div class="col" style="gap:14px;">
  <div class="label-xs">Easing curves (cubic-bezier)</div>

  <!-- Track 1: smooth / violet -->
  <div class="easing-row">
    <div class="easing-meta">
      <span class="easing-name" style="color:var(--violet);">smooth</span>
      <span class="easing-value mono">cubic-bezier(0.65, 0, 0.35, 1)</span>
    </div>
    <div class="easing-track" id="track-smooth">
      <div class="easing-ball" id="ball-smooth" style="background:var(--violet);"></div>
    </div>
  </div>

  <!-- Track 2: bounce / orange -->
  <div class="easing-row">
    <div class="easing-meta">
      <span class="easing-name" style="color:var(--orange);">bounce</span>
      <span class="easing-value mono">cubic-bezier(0.6, 0.05, 0.01, 0.99)</span>
    </div>
    <div class="easing-track" id="track-bounce">
      <div class="easing-ball" id="ball-bounce" style="background:var(--orange);"></div>
    </div>
  </div>

  <!-- Track 3: cubic / lime -->
  <div class="easing-row">
    <div class="easing-meta">
      <span class="easing-name" style="color:var(--violet-dark);">cubic</span>
      <span class="easing-value mono">cubic-bezier(0.83, 0, 0.17, 1)</span>
    </div>
    <div class="easing-track" id="track-cubic">
      <div class="easing-ball" id="ball-cubic" style="background:var(--lime);border:2px solid var(--violet-dark);box-sizing:border-box;"></div>
    </div>
  </div>

  <div class="row" style="align-items:center;gap:12px;">
    <button class="play-btn" id="play-btn">&#9654; Play</button>
    <span class="muted">Three named curves reused everywhere. Durations: 100 / 300 / 600 / 1200ms; gradient loop 25s.</span>
  </div>
</div>

<script>
(function () {
  const btn = document.getElementById('play-btn');

  const balls = [
    { id: 'ball-smooth', easing: 'cubic-bezier(0.65,0,0.35,1)',   track: 'track-smooth' },
    { id: 'ball-bounce', easing: 'cubic-bezier(0.6,0.05,0.01,0.99)', track: 'track-bounce' },
    { id: 'ball-cubic',  easing: 'cubic-bezier(0.83,0,0.17,1)',   track: 'track-cubic'  },
  ];

  function getEndLeft(trackId) {
    const track = document.getElementById(trackId);
    return track.offsetWidth - 40; // ball width 24px + margin 8px each side ≈ 40
  }

  btn.addEventListener('click', function () {
    btn.disabled = true;

    // Forward animation
    balls.forEach(function (b) {
      const ball = document.getElementById(b.id);
      const end = getEndLeft(b.track);
      ball.animate(
        [{ left: '8px' }, { left: end + 'px' }],
        { duration: 1200, easing: b.easing, fill: 'forwards' }
      );
    });

    // Return animation after 1800ms
    setTimeout(function () {
      balls.forEach(function (b) {
        const ball = document.getElementById(b.id);
        ball.animate(
          [{ left: (getEndLeft(b.track)) + 'px' }, { left: '8px' }],
          { duration: 600, easing: 'cubic-bezier(0.65,0,0.35,1)', fill: 'forwards' }
        );
      });

      // Re-enable button after return animation completes
      setTimeout(function () {
        btn.disabled = false;
      }, 650);
    }, 1800);
  });
})();
</script>
<script src="_theme.js"></script>
</body></html>
