<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);padding:20px;">
<div class="col" style="gap:16px;">
  <div class="label-xs">Light &amp; Dark mode — card in both contexts</div>
  <div class="row" style="gap:16px;">
    <!-- Light mode card -->
    <div style="background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid rgba(181,255,0,.30);border-radius:16px;padding:20px;flex:1;max-width:280px;">
      <div style="font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--violet);margin-bottom:6px;">Light mode</div>
      <div style="font-family:var(--font-sans);font-size:13px;color:rgba(105,0,255,.8);">Card background: lime/20 → orange/10 → violet/5. Border lime/30.</div>
    </div>
    <!-- Dark mode card -->
    <div style="background:linear-gradient(135deg,rgba(181,255,0,.10),rgba(255,122,0,.05),rgba(105,0,255,.10));backdrop-filter:blur(12px);border:1px solid rgba(181,255,0,.20);border-radius:16px;padding:20px;flex:1;max-width:280px;background-color:var(--dark-bg);">
      <div style="font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--beige);margin-bottom:6px;">Dark mode</div>
      <div style="font-family:var(--font-sans);font-size:13px;color:rgba(245,240,232,.7);">Same recipe, halved alphas. Border lime/20.</div>
    </div>
  </div>
  <div class="muted">Theme toggle: fixed bottom-left, same glass capsule button, animates icon 90° rotate with AnimatePresence.</div>
</div>
<script src="_theme.js"></script>
</body></html>
