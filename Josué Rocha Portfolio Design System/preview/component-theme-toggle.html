<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--beige);">
<div class="row" style="gap:16px;align-items:center;flex-wrap:wrap;">
  <!-- Light state: moon icon -->
  <div class="col" style="align-items:center;gap:8px;">
    <button style="width:48px;height:48px;border-radius:9999px;background:linear-gradient(135deg,rgba(181,255,0,.20),rgba(255,122,0,.10),rgba(105,0,255,.05));backdrop-filter:blur(12px);border:1px solid rgba(181,255,0,.50);display:inline-flex;align-items:center;justify-content:center;color:var(--violet);cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <span class="muted" style="font-size:11px;">Light mode</span>
  </div>
  <!-- Dark state: sun icon -->
  <div class="col" style="align-items:center;gap:8px;">
    <button style="width:48px;height:48px;border-radius:9999px;background:var(--dark-surface);backdrop-filter:blur(12px);border:1px solid rgba(181,255,0,.50);display:inline-flex;align-items:center;justify-content:center;color:var(--lime);cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <span class="muted" style="font-size:11px;">Dark mode</span>
  </div>
</div>
<div class="muted">Theme toggle — glass capsule, 48px, moon (light) / sun (dark), lime border, backdrop-blur.</div>
<script src="_theme.js"></script>
</body></html>
